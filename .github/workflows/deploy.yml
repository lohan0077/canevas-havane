name: Deploy Canevas Havane

on:
  push:
    branches: [ main ]
  # Sur une proposition de fusion, on lance les vérifications sans déployer.
  pull_request:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # La porte de sortie. Tant que ce job échoue, rien ne part en production.
  # ─────────────────────────────────────────────────────────────────────
  verifications:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks doit voir tout l'historique, pas seulement le dernier commit

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Typage strict
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Compilation
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://canevas-havane.com

      # Les trois outils ci-dessous sont installés en versions figées plutôt
      # qu'appelés via des actions tierces : une étiquette d'action peut être
      # redéplacée sur un autre commit, une version d'outil non.

      - name: Recherche de secrets (historique complet)
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1

      - name: Analyse statique
        run: |
          python3 -m pip install --quiet semgrep==1.172.0
          semgrep scan \
            --config=p/typescript \
            --config=p/nodejs \
            --config=p/security-audit \
            --config=semgrep/regles-maison.yml \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=_bmad \
            --error \
            --metrics=off

      - name: Dépendances vulnérables
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.73.0 fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            .

  # ─────────────────────────────────────────────────────────────────────
  # Déploiement — uniquement sur main, uniquement si les vérifications passent.
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Déploiement
    needs: verifications
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "~/app/canevas-havane"

      - name: Build and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/app/canevas-havane
            docker compose up -d --build
            # Caddy est déclaré dans le compose de Kéo : on le recharge depuis là.
            cd ~/app/keo
            docker compose restart caddy

      # Le déploiement n'est « réussi » que si le site répond vraiment.
      # Sans ce contrôle, un conteneur qui redémarre en boucle passe pour un succès.
      - name: Vérification après déploiement
        run: |
          set -e
          echo "Attente du redémarrage du conteneur…"
          sleep 20
          for tentative in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://canevas-havane.com/api/health || true)
            echo "Tentative $tentative : HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Le site répond et la configuration e-mail est en place."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Le site ne répond pas correctement après le déploiement (dernier code : $code)"
          exit 1
