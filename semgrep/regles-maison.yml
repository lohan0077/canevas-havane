# semgrep/regles-maison.yml — Canevas Havane
#
# Règles Semgrep écrites pour les invariants de CE projet.
# Les règles génériques (p/typescript, p/nodejs, p/security-audit) attrapent le connu ;
# celles-ci attrapent ce qui a réellement été trouvé sur le projet, le 09/08/2026 :
#   · une route publique sans plafond  → route-publique-sans-plafond
#   · un JSON.stringify injecté en HTML → jsonld-stringify-non-echappe
#
# Adaptations par rapport au modèle de la METHODE :
#   · route-publique-sans-plafond couvre toutes les routes (aucune n'est authentifiée)
#   · jsonLdScript est reconnu comme fabrique de HTML sûre
#
# Lancer :  semgrep --config semgrep/regles-maison.yml --error src/

rules:
  # ─── A01 — contrôle d'accès ─────────────────────────────────────────────
  - id: route-sans-garde-autorisation
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "**/api/**/route.ts"
    patterns:
      - pattern: |
          export async function $M(...) { ... }
      - metavariable-regex:
          metavariable: $M
          regex: "^(GET|POST|PUT|PATCH|DELETE)$"
      # ⚠️ À ADAPTER À CHAQUE PROJET : lister ici les vrais noms des gardes.
      # Sur Edificia, relevés dans le code : requireNodeAccess (117 usages),
      # requireSuperAdmin, requireTeamPlan, requireRowAccess, requireTenant,
      # requireValidOauthCallback, requireNodeForOauthStart.
      - pattern-not-regex: "(requireNodeAccess|requireSuperAdmin|requireTeamPlan|requireRowAccess|requireTenant|requireValidOauthCallback|requireNodeForOauthStart|requireUser|requireRole|requireSubscription|auth\\.getUser|resolveAuthorizedClientIds|constructEvent|verifierSignature|CRON_SECRET|semgrep-ok)"
    message: >-
      Cette route n'appelle aucun garde d'autorisation connu. Soit elle en manque un,
      soit elle est légitimement publique — dans ce cas ajouter un commentaire
      `// semgrep-ok: publique parce que …` et l'exclure explicitement.
      C'est exactement le défaut trouvé sur /api/operations/audit et /api/marketing/lighthouse.

  # ─── A05 / A03 — validation d'entrée ────────────────────────────────────
  - id: route-mutante-sans-validation
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "**/api/**/route.ts"
    patterns:
      - pattern: |
          export async function $M(...) { ... }
      - metavariable-regex:
          metavariable: $M
          regex: "^(POST|PUT|PATCH|DELETE)$"
      - pattern-not-regex: "(safeParse|z\\.object|zod)"
    message: >-
      Route qui écrit sans validation de schéma. Tout ce qui vient du client doit
      être décrit par un schéma Zod et refusé s'il n'y correspond pas.

  # ─── A10 — échouer en se fermant ────────────────────────────────────────
  - id: echec-ouvert
    languages: [typescript]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: try { ... } catch { return true }
          - pattern: try { ... } catch ($E) { return true }
          - pattern: try { ... } catch { $X = true }
          - pattern: try { ... } catch ($E) { $X = true }
    message: >-
      Échec ouvert : la vérification plante, donc on laisse passer. C'est la
      catégorie A10:2025. Un échec doit toujours refermer l'accès.

  - id: erreur-interne-renvoyee-au-client
    languages: [typescript]
    severity: WARNING
    paths:
      include:
        - "**/api/**/route.ts"
    pattern-regex: "(error|details)\\s*:\\s*(err|error|e|erreur|exception|ex)\\.(message|stack)"
    message: >-
      Le message d'erreur interne part chez le client. Il cartographie ton système.
      Message générique côté client, détail côté journal.

  # ─── A04 — secrets ──────────────────────────────────────────────────────
  - id: secret-dans-variable-publique
    languages: [typescript, javascript]
    severity: ERROR
    patterns:
      - pattern-regex: "NEXT_PUBLIC_[A-Z0-9_]*(SECRET|PRIVATE|SERVICE_ROLE|PASSWORD)"
    message: >-
      Tout NEXT_PUBLIC_* est inclus dans le bundle envoyé au navigateur, donc public
      et définitivement publié. Un secret n'y a pas sa place.

  - id: cle-service-role-cote-client
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "**/src/components/**"
        - "**/src/app/**/page.tsx"
        - "**/src/app/**/layout.tsx"
    patterns:
      - pattern-regex: "SERVICE_ROLE|service_role"
    message: >-
      La clé de service contourne tout le RLS. Elle ne doit jamais apparaître
      dans un fichier susceptible d'être envoyé au navigateur.

  - id: secret-journalise
    languages: [typescript, javascript]
    severity: ERROR
    patterns:
      - pattern-regex: "console\\.(log|info|warn|error|debug)\\([^)]*(secret|token|password|apiKey|api_key|service_role|Authorization)"
    message: >-
      Un secret dans les journaux transforme les journaux eux-mêmes en fuite.

  - id: aleatoire-non-cryptographique
    languages: [typescript]
    severity: WARNING
    patterns:
      - pattern-regex: "(token|jeton|secret|nonce|otp|code)[A-Za-z]*\\s*=\\s*[^;\\n]*Math\\.random"
    message: >-
      Math.random() est prévisible. Pour un jeton, utiliser crypto.randomUUID()
      ou crypto.randomBytes().

  # ─── A08 — intégrité ────────────────────────────────────────────────────
  - id: webhook-sans-verification-de-signature
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "**/webhook/**/route.ts"
        - "**/webhooks/**/route.ts"
    patterns:
      - pattern: |
          export async function POST(...) { ... }
      - pattern-not-regex: "(constructEvent|createHmac|timingSafeEqual|Webhook\\(|verifySignature|svix)"
    message: >-
      Webhook sans vérification de signature : n'importe qui peut appeler cette route
      en se faisant passer pour le fournisseur. Vérifier la signature AVANT tout traitement.

  # ─── A05 — XSS ──────────────────────────────────────────────────────────
  # Motif structurel et non expression régulière : avec `pattern-regex`, la partie
  # `pattern-not-regex` est confrontée au seul texte capturé — ici le mot
  # `dangerouslySetInnerHTML` — et ne voit donc jamais la fabrique employée.
  # C'est ce qui rendait la règle du modèle bruyante : 10 faux positifs sur ce projet.
  - id: html-injecte-sans-assainissement
    languages: [typescript]
    severity: ERROR
    patterns:
      # Le motif doit décrire l'élément JSX entier : semgrep ne reconnaît pas un
      # attribut isolé. Les `...` couvrent les autres attributs, avant et après.
      - pattern-either:
          - pattern: "<$EL ... dangerouslySetInnerHTML={$X} ... />"
          - pattern: "<$EL ... dangerouslySetInnerHTML={$X} ...>...</$EL>"
      # `jsonLdScript` (src/lib/seo.ts) échappe les chevrons et les séparateurs de ligne
      # Unicode : c'est la seule fabrique de HTML autorisée sur ce projet.
      - pattern-not: "<$EL ... dangerouslySetInnerHTML={jsonLdScript(...)} ... />"
      - pattern-not: "<$EL ... dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(...) }} ... />"
    message: >-
      HTML injecté sans assainissement. Pour du JSON-LD, passer par `jsonLdScript()`
      de src/lib/seo.ts ; pour du contenu rédigé ailleurs (Markdown, CMS, formulaire),
      passer par DOMPurify.

  # ─── A03 — le défaut trouvé lors de l'audit du 09/08/2026 ───────────────
  - id: jsonld-stringify-non-echappe
    languages: [typescript]
    severity: ERROR
    pattern-either:
      - pattern: "<$EL ... dangerouslySetInnerHTML={{ __html: JSON.stringify(...) }} ... />"
      - pattern: "<$EL ... dangerouslySetInnerHTML={{ __html: JSON.stringify(...) }} ...>...</$EL>"
    message: >-
      `JSON.stringify` injecté directement dans du HTML. Il n'échappe pas le chevron
      ouvrant : une chaîne contenant la fermeture d'une balise script sort du bloc et
      s'exécute. Passer par `jsonLdScript()` de src/lib/seo.ts, qui échappe.
      Inoffensif tant que les données sont écrites à la main — c'est le jour où un
      titre vient d'un formulaire ou d'un CMS que ça devient une XSS.

  # ─── A06 — conception : limitation de débit ─────────────────────────────
  - id: route-publique-sans-plafond
    languages: [typescript]
    severity: ERROR
    paths:
      # Sur ce projet, TOUTES les routes sont publiques : il n'y a pas d'authentification.
      # Le plafond est donc la seule protection, et il n'est optionnel nulle part.
      include:
        - "**/api/**/route.ts"
    patterns:
      - pattern: |
          export async function $M(...) { ... }
      - metavariable-regex:
          metavariable: $M
          regex: "^(GET|POST|PUT|PATCH|DELETE)$"
      - pattern-not-regex: "(429|plafond|limiterDebit|rateLimit|semgrep-ok)"
    message: >-
      Route publique ou coûteuse sans limitation de débit. Un formulaire public sans
      plafond, ce sont tes factures Resend et Anthropic. Une authentification sans
      plafond, c'est le bourrage d'identifiants.

  # ─── A02 — configuration ────────────────────────────────────────────────
  - id: cors-permissif-avec-cookies
    languages: [typescript]
    severity: ERROR
    patterns:
      - pattern-regex: "Access-Control-Allow-Origin[\"'\\s:,]+\\*"
    message: >-
      CORS ouvert à toutes les origines. À restreindre à la liste des origines connues.

  # ─── A04 — conception : taille du corps de requête ──────────────────────
  # Ajoutée le 10/08/2026 : `request.json()` chargeait 20 Mo en mémoire avant
  # toute vérification, et le champ piège du schéma n'avait aucune borne.
  - id: route-sans-plafond-de-corps
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "**/api/**/route.ts"
    patterns:
      - pattern: |
          export async function $M(...) { ... }
      - metavariable-regex:
          metavariable: $M
          regex: "^(POST|PUT|PATCH)$"
      - pattern-regex: "request\\.(json|text|formData|arrayBuffer)\\(\\)"
      - pattern-not-regex: "(lireCorpsPlafonne|content-length|contentLength|TAILLE_MAX|semgrep-ok)"
    message: >-
      Cette route lit le corps de la requête sans plafond de taille. `request.json()`
      met tout en mémoire avant que le moindre contrôle ne s'exécute : passer par
      `lireCorpsPlafonne()` (src/lib/corps-requete.ts), ou vérifier `content-length`
      d'abord. Trouvé le 10/08/2026 — 20 Mo étaient acceptés et analysés.

  # ─── Performance : images sans dimensionnement ──────────────────────────
  # Sans `sizes`, une image en `fill` est traitée comme si elle occupait toute
  # la largeur de la fenêtre : Next sert la plus grande variante disponible,
  # même pour une vignette dans une grille à trois colonnes.
  - id: image-fill-sans-sizes
    languages: [typescript]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: <Image ... fill ... />
          - pattern: <Image ... fill={true} ... />
      - pattern-not: <Image ... sizes="..." ... />
      - pattern-not: <Image ... sizes={...} ... />
    message: >-
      `<Image fill>` sans attribut `sizes`. Ajouter la largeur réelle occupée par
      l'image, par exemple sizes="(max-width: 768px) 100vw, 33vw" pour une grille
      à trois colonnes. 17 images étaient dans ce cas le 10/08/2026.

  # ─── Conception : tout formulaire public porte un champ piège ───────────
  # Ajoutée le 10/08/2026. Le bloc « newsletter » du journal postait vers
  # /api/contact sans champ piège : un robot visant /blog atteignait la boîte
  # Gmail sans être filtré, alors qu'il aurait été piégé sur /contact.
  - id: formulaire-sans-champ-piege
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "**/*.tsx"
    patterns:
      # On examine l'appel `fetch` complet, options comprises : c'est là que le
      # champ piège doit apparaître. Viser la fonction entière ne marche pas —
      # Semgrep réduit la zone examinée à l'intersection des motifs.
      - pattern: fetch("/api/contact", {...})
      - pattern-not-regex: "website"
    message: >-
      Ce formulaire poste vers /api/contact sans transmettre le champ piège `website`.
      Tout formulaire public doit porter le même piège anti-robot que celui de
      /contact, sinon il devient la porte de service.

  # ─── Accessibilité : contraste ──────────────────────────────────────────
  # Ces deux règles ne remplacent pas la mesure réelle en navigateur : elles
  # attrapent la façon dont le défaut se réintroduit en pratique, c'est-à-dire
  # en écrivant la classe. Seuils calculés le 10/08/2026 sur les couleurs du site.
  - id: accent-vif-en-couleur-de-texte
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "**/*.tsx"
    patterns:
      - pattern-regex: "text-\\[var\\(--color-primary\\)\\]"
    message: >-
      `--color-primary` (#F27438) donne 2,54:1 sur le beige : illisible en texte.
      Utiliser `--color-primary-texte`, qui vaut 4,85:1 sur fond clair et redevient
      l'orange vif sur fond sombre (règle d'héritage dans globals.css).

  - id: texte-sous-le-seuil-de-contraste
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "**/*.tsx"
    patterns:
      - pattern-either:
          # brun tabac sur beige : il faut au moins /70 pour atteindre 4,5:1
          - pattern-regex: "text-\\[var\\(--color-foreground\\)\\]/([0-9]|[1-6][0-9])\\b"
          # blanc sur brun : il faut au moins /60
          - pattern-regex: "text-white/([0-9]|[1-5][0-9])\\b"
    message: >-
      Texte trop pâle pour être lisible. Minimum /70 sur fond clair, /60 sur fond
      sombre — seuils calculés, pas choisis à vue. Pour un ornement réellement
      décoratif, utiliser la notation entre crochets (par exemple `/[0.05]`) et
      ajouter `select-none pointer-events-none`.

  - id: image-node-hors-support
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "**/Dockerfile"
        - "**/Dockerfile.*"
    patterns:
      - pattern-regex: "FROM\\s+node:(1[0-9]|2[013]|25)[-.\\s]"
    message: >-
      Cette version de Node n'est plus supportée : plus aucun correctif de sécurité
      n'arrivera pour le moteur qui exécute le site. Utiliser une version LTS
      encore suivie — 22 (jusqu'au 30/04/2027), 24 (30/04/2028) ou 26 (30/04/2029).

      Cette règle attrape ce qu'un scan de vulnérabilités ne peut pas voir : une
      version peut être hors support sans qu'aucune faille n'ait encore été publiée
      contre elle. Le 10/08/2026, l'image tournait sur Node 20, hors support depuis
      le 30 avril, et la CI affichait « 0 vulnérabilité » — parce qu'elle lisait les
      fichiers du dépôt sans jamais ouvrir l'image. Garde jumelle : l'étape
      `trivy image` de `.github/workflows/deploy.yml`.

      Penser à mettre à jour cette liste de versions quand la LTS courante sortira
      du support.

  - id: canonique-ecrit-a-la-main
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "**/app/**/page.tsx"
        - "**/app/**/layout.tsx"
    patterns:
      - pattern-regex: "alternates:\\s*\\{\\s*canonical:"
    message: >-
      Adresse canonique écrite à la main. Utiliser `...adressesDeLaPage("/le-chemin")`
      de `src/lib/seo.ts`, qui produit l'adresse canonique ET `og:url` ensemble.

      Les deux disaient des choses différentes : le canonique pointait sur la page,
      mais `og:url` restait figé sur l'accueil dans le layout, hérité par les treize
      pages — partager la page Tarifs affichait un aperçu renvoyant à l'accueil
      (contre-audit du 10/08/2026). Deux pièges à connaître si on est tenté de
      redéclarer `openGraph` : Next le **remplace** au lieu de le fusionner, ce qui
      fait perdre `og:site_name` et `og:locale` ; et déclarer un `openGraph` désactive
      la convention de fichier `opengraph-image.png`, donc l'aperçu part sans visuel.
      Pour surcharger — un article avec sa propre image — passer un second argument
      à `adressesDeLaPage()`.
