<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!--
    Grain de la surcouche `.noise-overlay`. Remplace l'image qui était chargée depuis
    grainy-gradients.vercel.app : ce domaine tiers renvoyait un 404 (l'effet était donc
    cassé) tout en recevant l'adresse IP de chaque visiteur à chaque page.
    Généré ici par le filtre SVG lui-même — aucun octet à télécharger ailleurs.
  -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="300" height="300" filter="url(#grain)" />
</svg>
